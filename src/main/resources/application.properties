spring.application.name=banking
server.port=${SERVER_PORT:8085}

# Database: defaults suit a local Postgres; override with environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fincore}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT: the secret must be a Base64-encoded key of at least 256 bits.
# Generate one with: openssl rand -base64 64
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Optional first admin account, created at startup if both are set and the email is unused.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
